name: Build Android apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        working-directory: android
        env:
          PP_VERSION_CODE: ${{ github.run_number }}
          PP_VERSION_NAME: 0.1.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Publish apk to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PrivatePicture-Android.apk
          gh release delete android-latest --yes --cleanup-tag >/dev/null 2>&1 || true          # tạo lại bản phát hành mỗi lần để thẻ luôn trỏ tới commit mới nhất
          gh release create android-latest PrivatePicture-Android.apk --title "App Android (v0.1.${{ github.run_number }})" --notes "APK cài trên điện thoại Android"
