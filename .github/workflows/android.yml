name: Build Android apk
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]            # mọi thay đổi đều dựng cả PC lẫn Android để hai app luôn cùng phiên bản
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Số phiên bản chung với bản PC
        run: python3 tools/version.py android >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Giải mã khóa ký bằng mật khẩu trong Secrets
        env:
          PP_KEY_PASS: ${{ secrets.PP_KEY_PASS }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android/app/pp.keystore.enc -out "$RUNNER_TEMP/pp.keystore" -pass env:PP_KEY_PASS
      - name: Build
        working-directory: android
        env:
          PP_KEYSTORE_FILE: ${{ runner.temp }}/pp.keystore
        run: gradle --no-daemon assembleRelease
      - name: Publish apk to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PrivatePicture-Android.apk
          gh release delete android-latest --yes --cleanup-tag >/dev/null 2>&1 || true          # tạo lại bản phát hành mỗi lần để thẻ luôn trỏ tới commit mới nhất
          gh release create android-latest PrivatePicture-Android.apk --title "App Android (v${{ env.PP_VERSION_NAME }})" --notes "APK cài trên điện thoại Android"
